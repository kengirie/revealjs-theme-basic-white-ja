<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ベーシックホワイト for reveal.js（Markdown 版）</title>
  <link rel="stylesheet" href="node_modules/reveal.js/dist/reset.css">
  <link rel="stylesheet" href="node_modules/reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="theme/basic-white.css">
</head>
<body>
<div class="reveal">
  <div class="slides">
    <!-- Markdown 版：スライドは slides.md に書く（--- で区切る。Note: 以降はスピーカーノート）。HTML で書く場合は index.html -->
    <section data-markdown="slides.md" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
  </div>
</div>
<script type="module">
  import Reveal from './node_modules/reveal.js/dist/reveal.mjs'
  import Markdown from './node_modules/reveal.js/dist/plugin/markdown.mjs'
  import Notes from './node_modules/reveal.js/dist/plugin/notes.mjs'
  import BasicWhite from './theme/basic-white.js'

  window.Reveal = Reveal

  Reveal.initialize({
    // Keynote と同じ 1920×1080（1pt = 1px）
    width: 1920,
    height: 1080,
    margin: 0,
    center: false,
    hash: true,
    transition: 'none',
    basicWhite: {
      // data-layout を書かないスライドのレイアウト
      defaultLayout: 'default',
      // true にすると枠の線を表示する
      debug: false,
    },
    // BasicWhite は Markdown の後に置く（Markdown を HTML にしてから枠に振り分けるため）
    plugins: [Markdown, Notes, BasicWhite],
  })
</script>
</body>
</html>
